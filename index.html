<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pagina riservata</title>
<style>
:root {
  --sfondo: #f6f6f3; --carta: #ffffff; --testo: #1d1f21; --tenue: #5d6266; --linea: #d0d1cc;
  --accento: #2f5d8a; --accento-testo: #ffffff; --errore: #b3261e;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --sfondo: #151719; --carta: #1e2124; --testo: #e7e8e6; --tenue: #a2a7ab; --linea: #3a3e42;
    --accento: #7fb0e0; --accento-testo: #10161c; --errore: #ff8f86;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: var(--sfondo); color: var(--testo); padding: 16px;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 16px;
}
form { width: 100%; max-width: 360px; background: var(--carta); border: 1px solid var(--linea); border-radius: 12px; padding: 22px 20px; }
h1 { font-size: 1.25rem; margin: 0 0 16px; }
label.campo { display: block; font-size: .9rem; color: var(--tenue); margin-bottom: 6px; }
input[type="password"] {
  font: inherit; width: 100%; min-height: 46px; padding: 8px 10px; border: 1px solid var(--linea); border-radius: 8px;
  background: var(--sfondo); color: var(--testo);
}
.ricorda { display: flex; align-items: center; gap: 10px; margin: 14px 0; font-size: .95rem; cursor: pointer; min-height: 44px; }
.ricorda input { width: 20px; height: 20px; margin: 0; accent-color: var(--accento); }
button {
  font: inherit; font-weight: 600; width: 100%; min-height: 46px; border: 0; border-radius: 8px;
  background: var(--accento); color: var(--accento-testo); cursor: pointer;
}
button:disabled { opacity: .6; cursor: progress; }
.messaggio { min-height: 1.4em; margin: 12px 0 0; font-size: .95rem; }
.messaggio.errore { color: var(--errore); font-weight: 600; }
.messaggio.attesa { color: var(--tenue); }
</style>
</head>
<body>
<form id="modulo" autocomplete="on">
  <h1>Pagina riservata</h1>
  <label class="campo" for="password">Password</label>
  <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
  <label class="ricorda"><input type="checkbox" id="ricorda"> Ricorda su questo dispositivo</label>
  <button type="submit" id="entra">Entra</button>
  <p class="messaggio" id="messaggio" role="status" aria-live="polite"></p>
</form>

  async function decifra(pw) {
    var sale = daBase64(el.getAttribute('data-sale'));
    var nonce = daBase64(el.getAttribute('data-nonce'));
    var cifrato = daBase64(el.getAttribute('data-cifrato'));
    var iterazioni = parseInt(el.getAttribute('data-iterazioni'), 10);
    var base = await cs.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    var chiave = await cs.deriveKey({ name: 'PBKDF2', salt: sale, iterations: iterazioni, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var chiaro = await cs.decrypt({ name: 'AES-GCM', iv: nonce }, chiave, cifrato);
    return new TextDecoder('utf-8').decode(chiaro);
  }

  function mostra(html) {
    document.open();
    document.write(html);
    document.close();
  }

  async function prova(pw, daMemoria) {
    bottone.disabled = true;
    messaggio('Sto aprendo la pagina…', 'attesa');
    // un attimo al browser per mostrare il messaggio prima del calcolo
    await new Promise(function (r) { setTimeout(r, 30); });
    var html;
    try {
      html = await decifra(pw);
    } catch (e) {
      bottone.disabled = false;
      if (daMemoria) { dimentica(); messaggio(''); }
      else { messaggio('Password sbagliata', 'errore'); campo.select(); }
      return;
    }
    if (ricorda.checked || daMemoria) salva(pw);
    mostra(html);
  }

  modulo.addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = campo.value.trim();
    if (!pw) { messaggio('Scrivi la password', 'errore'); return; }
    prova(pw, false);
  });

  var salvata = leggiSalvata();
  if (salvata) { ricorda.checked = true; prova(salvata, true); }
})();
</script>
</body>
</html>
